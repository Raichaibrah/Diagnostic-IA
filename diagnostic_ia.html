<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Data & IA Responsable</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 800px; /* Légèrement élargi pour le nouveau texte */
            width: 100%;
            padding: 40px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin: 0 0 10px 0;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .progress-bar {
            background-color: var(--border-color);
            border-radius: 8px;
            height: 8px;
            width: 100%;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .axe-label {
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .option-btn:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .results-section {
            display: none;
        }

        .results-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #eff6ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 15px auto;
            border: 4px solid var(--primary);
        }

        .profile-title {
            font-size: 1.5rem;
            color: var(--text-main);
            margin: 0;
        }

        .profile-sectors {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
            font-style: italic;
        }

        .card {
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .card p {
            margin: 0;
            color: var(--text-main);
            line-height: 1.5;
        }

        .guide-box {
            border-left: 4px solid var(--primary);
            background-color: #f0fdf4;
            border-color: var(--success);
        }

        .guide-list {
            margin: 0;
            padding-left: 20px;
        }

        .guide-list li {
            margin-bottom: 15px; /* Aéré pour les longs textes */
            line-height: 1.5;
            color: var(--text-main);
        }

        .btn-restart {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            display: block;
            margin: 30px auto 0 auto;
            width: 100%;
        }

        .btn-restart:hover {
            background-color: #000;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header" id="header">
            <h1>Diagnostic Data & IA Responsable</h1>
            <p>Positionnement Stratégique & Guide de Décision</p>
        </div>

        <div class="progress-bar" id="progress-bar-container">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div id="quiz-container">
            <div class="question-section">
                <span class="axe-label" id="axe-label"></span>
                <div class="question-text" id="question-text"></div>
                <div class="options" id="options-container"></div>
            </div>
        </div>

        <div id="results-container" class="results-section">
            <div class="results-header">
                <div class="score-circle">
                    <span id="score-display">0</span>
                </div>
                <h2 class="profile-title" id="profile-title">Profil</h2>
                <div class="profile-sectors" id="profile-sectors"></div>
            </div>
            
            <div class="card" style="border-left: 4px solid var(--warning);">
                <h3>⚠️ Enjeux et Dilemmes</h3>
                <p id="dilemma-text"></p>
            </div>

            <div class="card guide-box">
                <h3>🧭 Conseils et Plan d'Action</h3>
                <p style="margin-bottom: 15px; font-weight: bold; color: var(--success);">Recommandations sur mesure pour ce profil :</p>
                <ul class="guide-list" id="guide-list">
                    <!-- Rempli par JS -->
                </ul>
            </div>

            <button class="btn-restart" onclick="restartQuiz()">Réévaluer un autre projet</button>
        </div>
    </div>

    <script>
        const questions = [
            { axe: "Stratégie Cloud & Infra", question: "Critère principal de choix de l'hébergement cloud :", options: [ { text: "Vitesse de traitement et disponibilité maximale.", points: 1 }, { text: "Rentabilité financière, optimisation du budget et du ROI.", points: 2 }, { text: "Empreinte carbone du fournisseur et reporting GreenOps.", points: 3 } ] },
            { axe: "Stratégie Cloud & Infra", question: "Planification des traitements de données lourds :", options: [ { text: "Exécution immédiate ou en continu pour maximiser la disponibilité.", points: 1 }, { text: "Planification durant les heures creuses pour minimiser les coûts.", points: 2 }, { text: "Routage dynamique vers les régions à plus faible intensité carbone.", points: 3 } ] },
            { axe: "Cycle de Vie des Données", question: "Politique de stockage des données pour l'IA :", options: [ { text: "'Tout conserver' indéfiniment à chaud pour garantir l'innovation.", points: 1 }, { text: "Gestion selon les coûts de stockage, archivage si besoin.", points: 2 }, { text: "Minimisation des données (cycle de vie strict, déduplication).", points: 3 } ] },
            { axe: "Cycle de Vie des Données", question: "Optimisation des pipelines de données :", options: [ { text: "Construits pour la rapidité de déploiement, rarement revus.", points: 1 }, { text: "Périodiquement revus pour réduire les coûts financiers (compute).", points: 2 }, { text: "Revues strictes d'éco-conception (élimination des flux redondants).", points: 3 } ] },
            { axe: "Sélection Modèles IA", question: "Choix de l'architecture du modèle IA :", options: [ { text: "Modèles GenAI les plus vastes (état de l'art) pour la performance.", points: 1 }, { text: "Sélection du meilleur équilibre entre coût de l'API et précision.", points: 2 }, { text: "Priorisation de petits modèles (SLM) ou modèles locaux frugaux.", points: 3 } ] },
            { axe: "Sélection Modèles IA", question: "Supervision et monitoring des modèles en production :", options: [ { text: "Suivi de la disponibilité (uptime) et de l'expérience utilisateur.", points: 1 }, { text: "Surveillance étroite des appels d'API et de la facturation.", points: 2 }, { text: "Outils dédiés pour suivre les émissions de carbone en temps réel.", points: 3 } ] },
            { axe: "Gouvernance", question: "Intégration des coûts environnementaux dans le calcul du ROI :", options: [ { text: "Non intégrés ; l'innovation court terme est le seul moteur.", points: 1 }, { text: "Notés qualitativement, mais le ROI financier reste décisionnaire.", points: 2 }, { text: "Calcul d'un 'ROI Carbone' obligatoire ; risque d'annulation.", points: 3 } ] },
            { axe: "Gouvernance", question: "Collaboration opérationnelle entre la DSI et la RSE :", options: [ { text: "Très faible ; l'IT opère de manière indépendante.", points: 1 }, { text: "Occasionnelle, principalement pour le rapport RSE annuel.", points: 2 }, { text: "Continue ; intégration de KPIs Green IT partagés.", points: 3 } ] }
        ];

        const profiles = [
            {
                min: 8, max: 13,
                title: "Catégorie 3 : Maximisation de l'utilisation axée sur la performance et l'innovation",
                sectors: "Souvent poussées par l'effet \"FOMO\", ces entreprises déploient massivement l'IA.",
                dilemma: "L'usage est souvent peu encadré, les expérimentations se multiplient et l'impact n'est pas mesuré directement. Il faut instaurer une gouvernance sans pour autant brider la capacité d'innovation technique.",
                guide: [
                    "<strong>Canaliser via des \"Bacs à sable\" (Sandboxing) à quotas :</strong> Pour ne pas frustrer les équipes techniques tout en maîtrisant la \"Shadow AI\", créer des environnements de développement isolés avec des quotas de calcul stricts (\"hard limits\"). L'innovation reste libre, mais l'empreinte énergétique maximale est plafonnée.",
                    "<strong>Optimiser par des architectures RAG (Retrieval-Augmented Generation) :</strong> Pour les cas d'usage basés sur l'IA générative, imposer l'utilisation du RAG. En fournissant le bon contexte au modèle via une recherche vectorielle préalable, on réduit drastiquement les hallucinations, le nombre d'itérations nécessaires par les développeurs, et la taille des requêtes, optimisant ainsi la consommation globale.",
                    "<strong>Utiliser le coût (tokens) comme proxy environnemental :</strong> À défaut d'outils de mesure carbone complexes en interne, se servir du suivi financier de la consommation (volume de tokens) comme d'un indicateur de régulation pour limiter les usages abusifs."
                ]
            },
            {
                min: 14, max: 18,
                title: "Catégorie 2 : L'approche motivée et limitée par la maximisation du ROI",
                sectors: "La technologie est avant tout un levier d'efficacité organisationnelle et d'optimisation des coûts.",
                dilemma: "Ces organisations cherchent à déployer des cas d'usage à grande échelle (supply chain, logistique, retail) pour gagner en productivité. L'enjeu est de leur démontrer que la sobriété numérique est un vecteur direct de rentabilité.",
                guide: [
                    "<strong>Déployer des architectures Multi-Agents spécialisées :</strong> Plutôt que de solliciter un méga-modèle (LLM) très coûteux pour chaque requête métier, il est bien plus rentable de concevoir un système où de petits agents spécialisés se répartissent les tâches. Cette orchestration permet de réduire massivement les coûts d'API (tokens) et l'empreinte cloud, tout en augmentant la fiabilité et le ROI.",
                    "<strong>Alignement FinOps et GreenOps :</strong> Mettre en place des tableaux de bord unifiés qui croisent directement le coût financier d'une infrastructure cloud ou d'une requête API avec son coût carbone. La suppression des données obsolètes et l'extinction des environnements de test inactifs deviennent ainsi des objectifs financiers à impact écologique positif.",
                    "<strong>Conditionner l'IA aux gains opérationnels stricts :</strong> Ne valider les budgets d'IA que lorsque le gain de temps ou la réduction des coûts opérationnels compense le coût d'infrastructure de l'algorithme, tout en maintenant une validation humaine pour éviter les dérives algorithmiques génératrices de calculs superflus."
                ]
            },
            {
                min: 19, max: 24,
                title: "Catégorie 1 : Utilisation modérée dans une logique environnementale et éthique",
                sectors: "Ces entreprises intègrent déjà les questions de RSE et de sobriété numérique dans leurs réflexions.",
                dilemma: "Le principal défi pour ces organisations est de réussir à quantifier précisément l'impact de leurs outils, tout en conservant des modèles suffisamment performants pour leurs métiers.",
                guide: [
                    "<strong>Privilégier le \"TinyML\" et le Transfer Learning :</strong> Au lieu de développer des modèles depuis zéro, il est recommandé de spécialiser des modèles open-source pré-entraînés (Transfer Learning) ou de déployer des modèles légers (TinyML). Cela limite drastiquement les cycles d'entraînement et le coût computationnel.",
                    "<strong>Planification intelligente des calculs (Green Scheduling) :</strong> Pour les entraînements de modèles inévitables, mettre en place des gestionnaires de clusters qui décalent l'exécution des calculs lourds aux heures creuses, lorsque l'intensité carbone du mix énergétique du réseau est la plus faible.",
                    "<strong>Mesurer et afficher l'impact en temps réel :</strong> Mettre en place des indicateurs d'équivalent CO2 visibles par les collaborateurs à chaque requête ou lors de l'utilisation d'outils IA en interne, afin de responsabiliser les usages au quotidien."
                ]
            }
        ];

        let currentQuestion = 0;
        let totalScore = 0;

        function initQuiz() {
            currentQuestion = 0;
            totalScore = 0;
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('results-container').style.display = 'none';
            document.getElementById('header').style.display = 'block';
            document.getElementById('progress-bar-container').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('axe-label').textContent = `Axe : ${q.axe} (${currentQuestion + 1}/${questions.length})`;
            document.getElementById('question-text').textContent = q.question;
            
            const progress = (currentQuestion / questions.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option.text;
                btn.onclick = () => {
                    totalScore += option.points;
                    currentQuestion++;
                    if (currentQuestion < questions.length) loadQuestion();
                    else showResults();
                };
                optionsContainer.appendChild(btn);
            });
        }

        function showResults() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('header').style.display = 'none';
            document.getElementById('progress-bar-container').style.display = 'none';
            document.getElementById('results-container').style.display = 'block';

            document.getElementById('score-display').textContent = totalScore + " / 24";

            const profile = profiles.find(p => totalScore >= p.min && totalScore <= p.max);

            if (profile) {
                document.getElementById('profile-title').textContent = profile.title;
                document.getElementById('profile-sectors').textContent = profile.sectors;
                document.getElementById('dilemma-text').textContent = profile.dilemma;
                
                const guideList = document.getElementById('guide-list');
                guideList.innerHTML = '';
                profile.guide.forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = item;
                    guideList.appendChild(li);
                });
            }
        }

        initQuiz();
    </script>
</body>
</html>
